<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>saturn</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      font-family: "Courier New", Courier, monospace;
    }

    
    #art {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

  
    #box {
      position: fixed;
      top: 1rem;
      left: 1rem;
      max-width: min(22rem, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
      overflow: auto;
      padding: 1rem 1.25rem;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      line-height: 1.6;
    }

    #box p { margin: 1rem 0 0; }
    #box a { color: #000; }

    #box button {
      margin-top: 1rem;
      padding: 0.25rem 0.6rem;
      font: inherit;
      color: #000;
      background: #fff;
      border: 1px solid #000;
      border-radius: 0;
      cursor: pointer;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <canvas id="art" role="img"
    aria-label="Pixelated black and white rendition of a headless body being devoured, after Goya"></canvas>

  <div id="box">
    <a href="index.html">back to the moonviewing</a>

    
    <p>saturn.wav</p>
    <p>in spite of his father, he had overthrown him</p>
    <p>like man, saturn was paranoid</p>
    <p>so why must he slaughter his kin?</p>
  

    <button id="music-btn" hidden>play music</button>
  </div>

  <!-- ============ YOUR MUSIC GOES HERE ============
       1. Upload your song to your GitHub repository (for example: music.mp3)
       2. Type its exact file name between the quotes after src=
       Example: src="music.mp3"
       Leave it empty (src="") for no music. -->
  <audio id="music" src="" loop></audio>
  <!-- ============ END OF YOUR MUSIC ============ -->

  <script>
    (function () {
      var H = 96;
      var src = document.createElement('canvas');
      var g = src.getContext('2d');
      var out = document.getElementById('art');
      var o = out.getContext('2d');
      var seed = 7;

      function rnd(min, max) {
        seed = (seed * 16807) % 2147483647;
        return min + (seed / 2147483647) * (max - min);
      }
      function gray(v) { var n = Math.round(v * 255); return 'rgb(' + n + ',' + n + ',' + n + ')'; }
      function radial(x, y, r0, x2, y2, r1, a, b) {
        var gr = g.createRadialGradient(x, y, r0, x2, y2, r1);
        gr.addColorStop(0, gray(a)); gr.addColorStop(1, gray(b));
        return gr;
      }
      function line(x1, y1, x2, y2, v, w) {
        g.strokeStyle = gray(v); g.lineWidth = w;
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      }

      function draw() {
        seed = 7;
        var W = Math.max(48, Math.round(H * window.innerWidth / window.innerHeight));
        src.width = W; src.height = H;
        g.lineCap = 'round'; g.lineJoin = 'round';

        // darkness, with a faint glow behind the body
        g.fillStyle = radial(W / 2, 52, 2, W / 2, 52, 60, 0.2, 0);
        g.fillRect(0, 0, W, H);

        // the body, centered and enlarged
        g.save();
        g.translate(W / 2, 52); g.scale(1.2, 1.2); g.translate(-48, -48);
        g.translate(48, 50); g.rotate(-0.3);

        // legs
        line(-4, 18, -11, 50, 0.85, 6);
        line(4, 19, 6, 52, 0.85, 6);

        // gnawed arm on one side, hanging arm on the other
        line(-10, -14, -17, -6, 0.85, 5);
        g.fillStyle = gray(0.03);
        g.beginPath(); g.arc(-18, -5, 3.2, 0, Math.PI * 2); g.fill();
        line(10, -14, 16, 6, 0.85, 4.5);
        line(16, 6, 14, 20, 0.85, 4.5);

        // torso
        g.fillStyle = radial(-4, -8, 1, 0, 0, 22, 1, 0.45);
        g.beginPath(); g.ellipse(0, 0, 12, 22, 0, 0, Math.PI * 2); g.fill();

        // ragged stump where the head was
        g.fillStyle = gray(0.03);
        g.beginPath(); g.ellipse(0, -21, 7, 3.2, 0, 0, Math.PI * 2); g.fill();
        for (var k = -2; k <= 2; k++) {
          g.beginPath();
          g.moveTo(k * 3 - 1.6, -20); g.lineTo(k * 3 + 1.6, -20); g.lineTo(k * 3, -15 - rnd(0, 4));
          g.fill();
        }

        // blood running down the chest
        for (var b = -1; b <= 1; b++) {
          line(b * 4, -17, b * 4 + rnd(-2, 2), -5 + rnd(0, 12), 0.04, 1.6);
        }
        g.restore();

        // vignette
        var vg = g.createRadialGradient(W / 2, 50, 22, W / 2, 50, Math.max(W, H) * 0.62);
        vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.9)');
        g.fillStyle = vg; g.fillRect(0, 0, W, H);

        // reduce to pure black and white with a 4x4 ordered dither
        var bayer = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
        var data = g.getImageData(0, 0, W, H);
        var d = data.data;
        for (var y = 0; y < H; y++) {
          for (var x = 0; x < W; x++) {
            var p = (y * W + x) * 4;
            var lum = (0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2]) / 255;
            lum = Math.min(1, Math.max(0, (lum - 0.5) * 1.1 + 0.5));
            var t = (bayer[(y % 4) * 4 + (x % 4)] + 0.5) / 16;
            var v = lum > t ? 255 : 0;
            d[p] = d[p + 1] = d[p + 2] = v;
            d[p + 3] = 255;
          }
        }
        out.width = W; out.height = H;
        o.putImageData(data, 0, 0);
      }

      draw();
      var timer;
      window.addEventListener('resize', function () {
        clearTimeout(timer); timer = setTimeout(draw, 150);
      });
    })();

    // ---- Music: starts if a file is set above; the button lets you play or pause ----
    (function () {
      var audio = document.getElementById('music');
      var btn = document.getElementById('music-btn');
      if (!audio.getAttribute('src')) return;
      btn.hidden = false;

      function update() { btn.textContent = audio.paused ? 'play music' : 'pause music'; }
      audio.addEventListener('play', update);
      audio.addEventListener('pause', update);
      btn.addEventListener('click', function () {
        if (audio.paused) { audio.play().catch(function () {}); } else { audio.pause(); }
      });

      // browsers often block autoplay, so also start on the first click or key press
      var attempt = audio.play();
      if (attempt && attempt.catch) {
        attempt.catch(function () {
          function start(e) {
            if (e.target.closest && e.target.closest('#music-btn')) return;
            audio.play().catch(function () {});
          }
          document.addEventListener('pointerdown', start, { once: true });
          document.addEventListener('keydown', start, { once: true });
        });
      }
      update();
    })();
  </script>
</body>
</html>
