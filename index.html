<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>the moonviewing</title>
  <style>
    :root {
      --night: #14172b;
      --moon: #f1e6c8;
      --haze: #a9a58f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--night);
      color: var(--moon);
      font-family: "Courier New", Courier, monospace;
    }

    main {
      max-width: 44rem;
      padding: 12vh 1.5rem 4rem;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4.5vw, 2.5rem);
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: 0.01em;
    }

    p {
      margin: 1.5rem 0 0;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--haze);
    }
  </style>
</head>
<body>
  <main>
    <h1>to admire the beauty of the autumn full moon and to give thanks for the harvest</h1>
    <p>the moonviewing</p>
  </main>
</body>
</html>
